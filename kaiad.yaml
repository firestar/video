# Kaiad deployment config for video.synload.com
# Target: dedicated VM (kaiad docker agent) — NOT synload-k8s
# Repo: git@github.com:firestar/video.git

name: video
domain: video.synload.com

build:
  context: .
  dockerfile: Dockerfile

services:
  backend:
    image: video-backend
    build:
      context: backend
      dockerfile: Dockerfile
    ports:
      - containerPort: 3000
    env:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    healthcheck:
      path: /health
      port: 3000
      initialDelaySeconds: 10
      periodSeconds: 15

  frontend:
    image: video-frontend
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - containerPort: 3001
    env:
      NEXT_PUBLIC_API_URL: https://video.synload.com/api

  worker:
    image: video-worker
    build:
      context: backend
      dockerfile: Dockerfile.worker
    env:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}

  postgres:
    image: postgres:16-alpine
    ports:
      - containerPort: 5432
    env:
      POSTGRES_DB: video
      POSTGRES_USER: video
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volume: /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - containerPort: 6379
    volume: /data

  minio:
    image: minio/minio
    ports:
      - containerPort: 9000
      - containerPort: 9001
    env:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    args: server /data --console-address ":9001"
    volume: /data

ingress:
  host: video.synload.com
  tls: true
  rules:
    - path: /api
      backend: backend
      port: 3000
    - path: /
      backend: frontend
      port: 3001

volumes:
  - name: video-postgres
    host: ./data/postgres
  - name: video-minio
    host: ./data/minio
  - name: video-redis
    host: ./data/redis
