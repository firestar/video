# cargo-audit config — CI audit gate
#
# The legacy AWS SDK TLS stack (hyper 0.14 / rustls 0.21 / rustls-webpki 0.101) is gone:
# aws-sdk-s3 is built with default-features = false + `default-https-client` (rustls 0.23).
#
# `rsa 0.9.10` (RUSTSEC-2023-0071, Marvin timing sidechannel) has NO fixed
# upgrade available. It is only in Cargo.lock via sqlx-mysql (sqlx-macros optional
# driver) and is not compiled into the binaries; ignored until a fixed release lands.

[advisories]
ignore = [
  "RUSTSEC-2023-0071", # rsa Marvin timing — no fixed upgrade available, not compiled in
]
  "RUSTSEC-2026-0099", # rustls-webpki 0.101.7 wildcard name constraints — AWS SDK pinned stack
]
informational_warnings = ["RUSTSEC-2026-0173"]
